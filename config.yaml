# LaughLM TPU v5e Pre-Training Configuration
# Centralized optimization blueprint settings

optimizations:
  # Compute & Kernel Fusion
  kernel_backend: "native"         # Options: ["native", "tokamax"]

  # Data Ingestion
  data_backend: "native"           # Options: ["native", "grain"]

  # Distributed Mesh & Sharding
  sharding_strategy: "fsdp"        # Options: ["fsdp", "maxtext_3d"]

  # Optimizer Precision
  optimizer_mu_bf16: false         # Options: [true, false]

  # Checkpointing
  async_checkpointing: false       # Options: [true, false]
