model:
  vocab_size: 32064
  d_model: 640
  num_layers: 32
  num_heads: 10
  num_kv_heads: 10
  max_seq_len: 8192

architecture:
  positional: rope
  normalization: rms_norm
  norm_placement: pre
  attention_variant: mha
  attention_impl: splash
  attention_fallback: error
  fused_qkv: true
  ffn_type: swiglu
  residual: standard
  embeddings: standard
  bias: false
  weight_tying: true
  parallel_block: false

initialization:
  method: normal
  std: 0.01
  embedding_std: 0.01
  attention_std: 0.01
  mlp_std: 0.01
  residual_scale: 1.0

optimizer:
  type: adamw

  # CPT should be gentler than base pretraining.
  learning_rate: 5.0e-5

  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  weight_decay: 0.1
  gradient_clip: 1.0
  mu_dtype: bfloat16

scheduler:
  type: wsd

  # Keep same long horizon so resumed step stays consistent.
  horizon_tokens: 20_000_000_000
  warmup_fraction: 0.01
  stable_fraction: 0.95
  min_lr_ratio: 0.05

loss:
  chunked_logits: true
  logits_chunk_size: 4096
  remat_logits_chunks: true
  z_loss: 1.0e-4
  ignore_index: -100

runtime:
  backend: pmap
  seq_len: 2048
  micro_batch_per_device: 2
  gradient_accumulation: 16

  # IMPORTANT:
  # v0.1 ended around 8B tokens.
  # This smoke adds ~100M tokens.
  # So cumulative stop target = 8.1B.
  total_tokens: 9_000_000_000

  # 100M tokens is only ~191 optimizer steps with your batch setup,
  # so old interval=1000 would never eval/checkpoint during the run.
  eval_interval: 50
  log_interval: 50
  checkpoint_interval: 1000
  checkpoint_max_to_keep: 2

  # New checkpoint dir copied from v0.1.
  checkpoint_dir: checkpoints

data:
  sources:
    - name: cpt-smollm-edu-smoke-100m
      weight: 1.0
      split: train
  max_seq_len: 2048
  packing: true
  eos_between_docs: true
  pad_to_multiple: 128

tokenizer:
  algorithm: bpe
  vocab_size: 32064
  pre_tokenizer: byte_level
  number_tokenization: whole_number
  output_format: huggingface_fast

parallelism:
  data_parallel: 8
  model_parallel: 1
  compute_dtype: bfloat16
  param_dtype: float32

spmd:
  mesh:
    ici_data_parallelism: 8
    ici_fsdp_parallelism: 1
    ici_tensor_parallelism: 1
    ici_sequence_parallelism: 1
    ici_pipeline_parallelism: 1
    dcn_data_parallelism: 1
    dcn_fsdp_parallelism: 1
    dcn_tensor_parallelism: 1
    dcn_pipeline_parallelism: 1
  axis_rules:
    batch: data
    embed: null
    heads: null
    kv_heads: null
    mlp: null
    vocab: null
    sequence: null
    layers: null
  remat:
    policy: dots_saveable
    granularity: block
    scan_layers: false
    prevent_cse: false
  dtype:
    param_dtype: float32
    compute_dtype: bfloat16
    output_dtype: float32

monitoring:
  tensorboard: false
  rich_terminal: true

hardware:
  accelerator: tpu
  type: v5e-8
