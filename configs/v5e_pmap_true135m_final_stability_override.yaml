# Final M6-selected configuration stability run.
# Base: v5e_pmap_true135m_production.yaml

runtime:
  eval_interval: 100
  # Keep only the final stability checkpoint to avoid overlapping Orbax writes
  # exhausting the limited /kaggle/working filesystem.
  checkpoint_interval: 200
  checkpoint_max_to_keep: 1
  checkpoint_dir: /tmp/laughlm_checkpoints/135M_final_prefetch16_stability

optimizations:
  compilation_cache_dir: /tmp/laughlm_jax_cache/v5e_true135m_final_prefetch16_stability

profiling:
  capture_device_memory_profile: true
  memory_profile_step: 10
  output_dir: /tmp/laughlm_profiles/135M_final_prefetch16_stability
