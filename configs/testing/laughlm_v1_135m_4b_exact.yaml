# Standalone export/parity configuration for the completed LaughLM-v1 4B run.
# This is intentionally complete; it does not depend on an override config.
# Architecture must match the checkpoint exactly: 1024/8, GQA 8/4, SwiGLU.

model:
  vocab_size: 32064
  d_model: 1024
  num_layers: 8
  num_heads: 8
  num_kv_heads: 4
  max_seq_len: 2048

architecture:
  positional: rope
  normalization: rms_norm
  norm_placement: pre
  attention_variant: gqa
  attention_impl: splash
  attention_fallback: error
  splash_block_size: 512
  fused_qkv: true
  ffn_type: swiglu
  residual: standard
  embeddings: standard
  bias: false
  weight_tying: true
  parallel_block: false

initialization:
  method: normal
  std: 0.01
  embedding_std: 0.01
  attention_std: 0.01
  mlp_std: 0.01
  residual_scale: 1.0

optimizer:
  type: adamw
  learning_rate: 2.0e-4
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  weight_decay: 0.1
  gradient_clip: 1.0
  mu_dtype: bfloat16

scheduler:
  type: wsd
  horizon_tokens: 20_000_000_000
  warmup_fraction: 0.01
  stable_fraction: 0.95
  min_lr_ratio: 0.05

loss:
  chunked_logits: true
  logits_chunk_size: 4096
  remat_logits_chunks: true
  z_loss: 1.0e-4
  ignore_index: -100

runtime:
  backend: pmap
  seq_len: 2048
  micro_batch_per_device: 2
  gradient_accumulation: 32
  prefetch_size: 16
  total_tokens: 4_000_000_000
  eval_interval: 500
  eval_batches: 4
  log_interval: 100
  checkpoint_interval: 500
  checkpoint_max_to_keep: 2
  checkpoint_dir: checkpoints/testing/laughlm_v1_135m_8shards

data:
  hf_repo_id: LaughTaleAI/LaughLM-Tokenized-Fine
  hf_revision: null
  sources:
    - name: laughlm-v1-mixed
      weight: 1.0
      split: train
  max_seq_len: 2048
  packing: true
  eos_between_docs: true
  pad_to_multiple: 128
  shard_directory: laughlm-v1
  shard_filename_prefix: laughlm-v1_shard
  train_shard_start: 0
  train_shard_count: 16
  validation_shard_start: 16
  validation_shard_count: 2
  hf_cache_dir: /tmp/laughlm_hf_cache
  record_exposure_stats: false
  exposure_chunk_tokens: 1000000

tokenizer:
  algorithm: bpe
  vocab_size: 32064
  pre_tokenizer: byte_level
  number_tokenization: whole_number
  output_format: huggingface_fast

parallelism:
  data_parallel: 8
  model_parallel: 1
  compute_dtype: bfloat16
  param_dtype: float32

spmd:
  mesh:
    ici_data_parallelism: 8
    ici_fsdp_parallelism: 1
    ici_tensor_parallelism: 1
    ici_sequence_parallelism: 1
    ici_pipeline_parallelism: 1
    dcn_data_parallelism: 1
    dcn_fsdp_parallelism: 1
    dcn_tensor_parallelism: 1
    dcn_pipeline_parallelism: 1
  axis_rules:
    batch: data
    embed: null
    heads: null
    kv_heads: null
    mlp: null
    vocab: null
    sequence: null
    layers: null
  remat:
    policy: dots_saveable
    granularity: block
    scan_layers: false
    prevent_cse: false
  dtype:
    param_dtype: float32
    compute_dtype: bfloat16
    output_dtype: float32

monitoring:
  tensorboard: false
  rich_terminal: true
  training_integrity: false
  integrity_interval: 100

hardware:
  accelerator: tpu
  type: v5e-8

optimizations:
  compilation_cache_dir: jax_cache/laughlm_v1_135m_4b_export
  kernel_backend: native
  data_backend: native
  sharding_strategy: pmap
  optimizer_mu_bf16: true
  async_checkpointing: false
