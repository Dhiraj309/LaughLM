model:
  vocab_size: 32064
  d_model: 2048
  num_layers: 24
  num_heads: 32
  num_kv_heads: 32
  max_seq_len: 8192

architecture:
  positional: rope
  normalization: rms_norm
  norm_placement: pre
  attention_variant: mha
  attention_impl: splash
  attention_fallback: error

  # Speed path.
  # IMPORTANT: changes parameter layout vs fused_qkv=false.
  # Use a fresh checkpoint_dir.
  fused_qkv: false

  ffn_type: swiglu
  residual: standard
  embeddings: standard
  bias: false
  weight_tying: true
  parallel_block: false

initialization:
  method: normal
  std: 0.01
  embedding_std: 0.01
  attention_std: 0.01
  mlp_std: 0.01
  residual_scale: 1.0

optimizer:
  type: adamw
  learning_rate: 5.0e-5
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  weight_decay: 0.1
  gradient_clip: 1.0
  mu_dtype: bfloat16

scheduler:
  type: wsd

  # Throughput/smoke horizon.
  # Keep equal to runtime.total_tokens for this fresh speed run.
  horizon_tokens: 100_007_936

  warmup_fraction: 0.01
  stable_fraction: 0.95
  min_lr_ratio: 0.05

loss:
  chunked_logits: true

  # Faster than 4096 if memory fits.
  # If this OOMs, fall back to 4096.
  logits_chunk_size: 4096

  # Speed-first.
  # If this OOMs, set true.
  remat_logits_chunks: True

  z_loss: 1.0e-4
  ignore_index: -100

runtime:
  backend: fsdp
  seq_len: 2048

  # Throughput-tuned FSDP attempt.
  #
  # Mesh:
  #   data=4
  #   fsdp=2
  #
  # Global microbatch:
  #   data replicas * micro_batch_per_device
  #   4 * 4 = 16 sequences
  #
  # Tokens/update:
  #   seq_len * global_microbatch * gradient_accumulation
  #   2048 * 16 * 4 = 131,072
  #
  # Total steps:
  #   100,007,936 / 131,072 = 763
  micro_batch_per_device: 2
  gradient_accumulation: 8

  total_tokens: 100_007_936

  eval_interval: 10000
  log_interval: 20

  # Disable mid-run checkpoint for clean throughput measurement.
  # Trainer still saves final checkpoint.
  checkpoint_interval: 10000
  checkpoint_max_to_keep: 2

  # Fresh dir required because this config changes:
  # - fused_qkv
  # - mesh layout
  # - loss chunk/remat behavior
  checkpoint_dir: checkpoints/v5e_fsdp_1p3b_speed_d4_f2_mb4_ga4_fqkv_lc8192_noremat

data:
  sources:
    - name: cpt-smollm-edu-smoke-100m
      weight: 1.0
      split: train

  max_seq_len: 2048
  packing: true
  eos_between_docs: true
  pad_to_multiple: 128

tokenizer:
  algorithm: bpe
  vocab_size: 32064
  pre_tokenizer: byte_level
  number_tokenization: whole_number
  output_format: huggingface_fast

parallelism:
  # Legacy compatibility block.
  # Keep data_parallel aligned with spmd.mesh data axis because config
  # validation and scheduler accounting still inspect this field.
  data_parallel: 4

  # Legacy field; for this FSDP run, mirror fsdp axis size.
  model_parallel: 2

  compute_dtype: bfloat16
  param_dtype: float32

spmd:
  mesh:
    # v5e-8 optimized speed sweep:
    # more data replicas, less FSDP sharding than data=2/fsdp=4.
    ici_data_parallelism: 4
    ici_fsdp_parallelism: 2
    ici_tensor_parallelism: 1
    ici_sequence_parallelism: 1
    ici_pipeline_parallelism: 1

    dcn_data_parallelism: 1
    dcn_fsdp_parallelism: 1
    dcn_tensor_parallelism: 1
    dcn_pipeline_parallelism: 1

  axis_rules:
    batch: data
    embed: fsdp
    heads: null
    kv_heads: null
    mlp: null
    vocab: null
    sequence: null
    layers: null

  remat:
    policy: dots_saveable
    granularity: block
    scan_layers: false
    prevent_cse: false

  dtype:
    param_dtype: float32
    compute_dtype: bfloat16
    output_dtype: float32

monitoring:
  tensorboard: false
  rich_terminal: true

hardware:
  accelerator: tpu
  type: v5e-8
