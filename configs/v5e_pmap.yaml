model:
  vocab_size: 32064
  d_model: 640
  num_layers: 32
  num_heads: 10
  num_kv_heads: 10
  max_seq_len: 8192

architecture:
  positional: rope
  normalization: rms_norm
  norm_placement: pre
  attention_variant: gqa
  attention_impl: splash
  attention_fallback: error
  fused_qkv: true
  ffn_type: swiglu
  residual: standard
  embeddings: standard
  bias: false
  weight_tying: true
  parallel_block: false

initialization:
  method: normal
  std: 0.01
  embedding_std: 0.01
  attention_std: 0.01
  mlp_std: 0.01
  residual_scale: 1.0

optimizer:
  type: adamw
  learning_rate: 1.5e-4
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  weight_decay: 0.1
  gradient_clip: 1.0
  mu_dtype: bfloat16

scheduler:
  type: wsd

  # LR schedule horizon.
  # Keep this fixed across staged training.
  # Example:
  #   stage 1 runtime.total_tokens = 1B
  #   stage 2 runtime.total_tokens = 2B
  #   ...
  #   scheduler.horizon_tokens stays 20B
  horizon_tokens: 20_000_000_000

  # Long-pretraining WSD:
  # 1% warmup, 95% stable, remaining ~4% decay.
  warmup_fraction: 0.01
  stable_fraction: 0.95
  min_lr_ratio: 0.05

loss:
  chunked_logits: true
  logits_chunk_size: 4096
  remat_logits_chunks: true
  z_loss: 1.0e-4
  ignore_index: -100

runtime:
  backend: pmap
  seq_len: 2048
  micro_batch_per_device: 2
  gradient_accumulation: 16

  # Current cumulative stop target.
  # Increase this stage-by-stage:
  #   1_000_000_000
  #   2_000_000_000
  #   5_000_000_000
  #   10_000_000_000
  #   20_000_000_000
  #
  # Do NOT use this as the LR horizon anymore.
  total_tokens: 8_000_000_000

  eval_interval: 1000
  log_interval: 50
  checkpoint_interval: 1000
  checkpoint_max_to_keep: 2
  checkpoint_dir: checkpoints

data:
  sources:
    - name: fineweb-edu
      weight: 1.0
      split: train
  max_seq_len: 2048
  packing: true
  eos_between_docs: true
  pad_to_multiple: 128

tokenizer:
  algorithm: bpe
  vocab_size: 32064
  pre_tokenizer: byte_level
  number_tokenization: whole_number
  output_format: huggingface_fast

parallelism:
  data_parallel: 8
  model_parallel: 1
  compute_dtype: bfloat16
  param_dtype: float32

spmd:
  mesh:
    ici_data_parallelism: 8
    ici_fsdp_parallelism: 1
    ici_tensor_parallelism: 1
    ici_sequence_parallelism: 1
    ici_pipeline_parallelism: 1
    dcn_data_parallelism: 1
    dcn_fsdp_parallelism: 1
    dcn_tensor_parallelism: 1
    dcn_pipeline_parallelism: 1
  axis_rules:
    batch: data
    embed: null
    heads: null
    kv_heads: null
    mlp: null
    vocab: null
    sequence: null
    layers: null
  remat:
    policy: dots_saveable
    granularity: block
    scan_layers: false
    prevent_cse: false
  dtype:
    param_dtype: float32
    compute_dtype: bfloat16
    output_dtype: float32

monitoring:
  tensorboard: false
  rich_terminal: true

hardware:
  accelerator: tpu
  type: v5e-8
