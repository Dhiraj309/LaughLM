model:
  vocab_size: 49152
  d_model: 768
  num_layers: 16
  num_heads: 12
  num_kv_heads: 12
  max_seq_len: 2048

architecture:
  positional: rope
  normalization: rms_norm
  norm_placement: pre
  attention_variant: gqa
  attention_impl: splash
  ffn_type: swiglu
  residual: standard
  embeddings: standard
  bias: false
  weight_tying: true
  parallel_block: false

initialization:
  method: normal
  std: 0.01
  embedding_std: 0.01
  attention_std: 0.01
  mlp_std: 0.01
  residual_scale: 1.0

optimizer:
  type: adamw
  learning_rate: 1.5e-4
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  weight_decay: 0.1
  gradient_clip: 1.0

scheduler:
  type: wsd
  warmup_fraction: 0.02
  stable_fraction: 0.20
  min_lr_ratio: 0.05

runtime:
  seq_len: 2048
  micro_batch_per_device: 16
  gradient_accumulation: 1
  total_tokens: 20_000_000
  eval_interval: 1000
  log_interval: 10
  checkpoint_interval: 500
  checkpoint_max_to_keep: 2
  checkpoint_dir: checkpoints/v5e_pmap

data:
  sources:
    - name: fineweb-edu
      weight: 1.0
      split: train
  max_seq_len: 2048
  packing: true
  eos_between_docs: true
  pad_to_multiple: 64

tokenizer:
  algorithm: bpe
  vocab_size: 49152
  pre_tokenizer: byte_level
  number_tokenization: whole_number
  output_format: huggingface_fast

parallelism:
  data_parallel: 8
  model_parallel: 1
  compute_dtype: bfloat16
  param_dtype: float32

spmd:
  mesh:
    ici_data_parallelism: 8
    ici_fsdp_parallelism: 1
    ici_tensor_parallelism: 1
    ici_sequence_parallelism: 1
    ici_pipeline_parallelism: 1
    dcn_data_parallelism: 1
    dcn_fsdp_parallelism: 1
    dcn_tensor_parallelism: 1
    dcn_pipeline_parallelism: 1
  axis_rules:
    batch: data
    embed: null
    heads: null
    kv_heads: null
    mlp: null
    vocab: null
    sequence: null
    layers: null
  remat:
    policy: dots_saveable
    granularity: block
    scan_layers: false
    prevent_cse: false
  dtype:
    param_dtype: float32
    compute_dtype: bfloat16
    output_dtype: float32

monitoring:
  tensorboard: false
  rich_terminal: true

hardware:
  accelerator: tpu
  type: v5e-8
