# Overlay for a short end-to-end 100M-token smoke run.
# Base: configs/v5e_pmap_true135m_production.yaml

runtime:
  total_tokens: 100_000_000
  eval_interval: 25
  eval_batches: 4
  log_interval: 10
  checkpoint_interval: 100
  checkpoint_max_to_keep: 2
  checkpoint_dir: checkpoints/smoke/135M_smol_100m

data:
  sources:
    - name: laughlm-v1-mixed
      weight: 1.0
      split: train
  hf_repo_id: "LaughTaleAI/LaughLM-Tokenized-Fine"
  shard_directory: "laughlm-v1"
  shard_filename_prefix: "laughlm-v1_shard"
  train_shard_start: 0
  train_shard_count: 1
  validation_shard_start: 1
  validation_shard_count: 1

optimizations:
  sharding_strategy: pmap
  kernel_backend: native
  data_backend: native
  optimizer_mu_bf16: true
  async_checkpointing: true
