# ════════════════════════════════════════════════════════════════
# LaughLM — TPU v5e-8 MAX THROUGHPUT CONFIG
# Target: 45–65% MFU, 150k–300k tokens/sec
# ════════════════════════════════════════════════════════════════

model:
  vocab_size: 49152
  d_model: 768
  num_layers: 16
  num_heads: 6
  num_kv_heads: 2
  max_seq_len: 2048   # keep model max high (for scaling)

architecture:
  positional: rope
  normalization: rms_norm
  norm_placement: pre
  attention_variant: gqa
  attention_impl: flash
  ffn_type: swiglu
  residual: standard
  embeddings: standard
  bias: false
  weight_tying: true
  parallel_block: true   # ✅ IMPORTANT (saves compute + sync)

initialization:
  method: normal
  std: 0.02
  embedding_std: 0.02
  attention_std: 0.02
  mlp_std: 0.02
  residual_scale: 1.0

optimizer:
  type: adamw
  learning_rate: 3e-4
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  weight_decay: 0.1
  gradient_clip: 1.0

scheduler:
  type: wsd
  warmup_fraction: 0.05
  stable_fraction: 0.10
  min_lr_ratio: 0.1

# ════════════════════════════════════════════════════════════════
# 🚀 RUNTIME — CRITICAL FOR THROUGHPUT
# ════════════════════════════════════════════════════════════════

runtime:
  seq_len: 1536                    # 🔥 higher MFU than 1024
  micro_batch_per_device: 32       # 🔥 key driver of utilization
  gradient_accumulation: 1         # 🔥 TPU prefers real batch > accum

  total_tokens: 1_000_000_000

  eval_interval: 100
  log_interval: 10

  checkpoint_interval: 500
  checkpoint_max_to_keep: 3
  checkpoint_dir: checkpoints

# ════════════════════════════════════════════════════════════════
# 🚀 DATA PIPELINE — HUGE IMPACT
# ════════════════════════════════════════════════════════════════

data:
  sources: []

  max_seq_len: 1536

  packing: true              # 🔥 MASSIVE throughput gain
  eos_between_docs: true
  pad_to_multiple: 64        # 🔥 reduce padding waste (was 128)

# ════════════════════════════════════════════════════════════════

tokenizer:
  algorithm: bpe
  vocab_size: 49152
  pre_tokenizer: byte_level
  number_tokenization: single_digit
  output_format: huggingface_fast

hardware:
  accelerator: tpu
  type: v5e

# ════════════════════════════════════════════════════════════════
# ⚡ LEGACY PARALLELISM (kept for compat)
# ════════════════════════════════════════════════════════════════

parallelism:
  data_parallel: 4
  model_parallel: 2
  compute_dtype: bfloat16
  param_dtype: float32

# ════════════════════════════════════════════════════════════════
# 🧠 SPMD — THIS IS WHERE THE REAL PERFORMANCE COMES FROM
# ════════════════════════════════════════════════════════════════

spmd:
  mesh:
    # 🔥 Balanced mesh (better than pure DP=8)
    ici_data_parallelism: 4
    ici_fsdp_parallelism: 1
    ici_tensor_parallelism: 2   # 🔥 critical for 400M–600M
    ici_sequence_parallelism: 1
    ici_pipeline_parallelism: 1

    dcn_data_parallelism: 1
    dcn_fsdp_parallelism: 1
    dcn_tensor_parallelism: 1
    dcn_pipeline_parallelism: 1

  axis_rules:
    batch: "data"
    embed: null          # replicate → avoids costly shard gathers
    heads: "tensor"
    kv_heads: "tensor"
    mlp: "tensor"
    vocab: null          # replicate improves throughput at this scale
    sequence: null
    layers: null

  # ════════════════════════════════════════════════════════════
  # 🔥 REMATERIALIZATION — KEY FOR BIGGER BATCH
  # ════════════════════════════════════════════════════════════

  remat:
    policy: nothing_saveable     # 🔥 MAX MFU (more recompute, less memory)
    granularity: block
    scan_layers: true            # 🔥 critical for compile + memory
    prevent_cse: false

  # ════════════════════════════════════════════════════════════
  # ⚡ DTYPE POLICY — PERFECTLY ALIGNED WITH TPU
  # ════════════════════════════════════════════════════════════

  dtype:
    param_dtype: float32
    compute_dtype: bfloat16
    output_dtype: float32

monitoring:
  tensorboard: false
  rich_terminal: true