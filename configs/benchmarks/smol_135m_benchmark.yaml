# Overlay for compile/throughput benchmarking.
# Use --max_steps to control benchmark length.
# Base: configs/v5e_pmap_true135m_production.yaml

runtime:
  total_tokens: 100_000_000
  eval_interval: 1000
  log_interval: 10
  checkpoint_interval: 1000
  checkpoint_max_to_keep: 1
  checkpoint_dir: checkpoints/benchmarks/135M_smol

data:
  sources:
    - name: laughlm-v1-mixed
      weight: 1.0
      split: train
  hf_repo_id: "LaughTaleAI/LaughLM-Tokenized-Fine"
  shard_directory: "laughlm-v1"
  shard_filename_prefix: "laughlm-v1_shard"
  train_shard_start: 0
  train_shard_count: 1
  validation_shard_count: 0

optimizations:
  compilation_cache_dir: jax_cache/v5e_smol_135m_benchmark
  sharding_strategy: pmap
  kernel_backend: native
  data_backend: native
  optimizer_mu_bf16: true
  async_checkpointing: true
