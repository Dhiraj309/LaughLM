# LaughLM-v1 127M: explicit 20B -> 24B continuation experiment.
#
# The parent 20B checkpoint is restored once. New checkpoints are written to
# a separate directory. The continuation scheduler starts at the parent's
# final WSD LR and decays without a warmup or LR restart.

model:
  vocab_size: 32064
  d_model: 1024
  num_layers: 8
  num_heads: 8
  num_kv_heads: 4
  max_seq_len: 2048

architecture:
  positional: rope
  normalization: rms_norm
  norm_placement: pre
  attention_variant: gqa
  attention_impl: splash
  attention_fallback: error
  splash_block_size: 512
  fused_qkv: true
  ffn_type: swiglu
  residual: standard
  embeddings: standard
  bias: false
  weight_tying: true
  parallel_block: false

initialization:
  method: normal
  std: 0.01
  embedding_std: 0.01
  attention_std: 0.01
  mlp_std: 0.01
  residual_scale: 1.0

optimizer:
  type: adamw
  learning_rate: 2.0e-4
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  weight_decay: 0.1
  gradient_clip: 1.0
  mu_dtype: bfloat16

scheduler:
  type: continuation_decay
  continuation_start_tokens: 20_000_000_000
  continuation_end_tokens: 24_000_000_000
  continuation_start_lr: 1.0e-5
  continuation_end_lr: 1.0e-6
  continuation_decay_type: linear

loss:
  backend: native
  chunked_logits: true
  logits_chunk_size: 4096
  remat_logits_chunks: true
  z_loss: 1.0e-4
  ignore_index: -100

runtime:
  backend: pmap
  seq_len: 2048
  micro_batch_per_device: 2
  gradient_accumulation: 16
  prefetch_size: 16

  total_tokens: 24_000_000_000
  resume_mode: scheduler_fork
  resume_from: checkpoints/production/laughlm_v1_127m_20b

  eval_interval: 500
  eval_batches: 32
  log_interval: 100
  checkpoint_interval: 1000
  checkpoint_max_to_keep: 10
  checkpoint_dir: checkpoints/production/laughlm_v1_127m_24b_extension

data:
  hf_repo_id: LaughTaleAI/LaughLM-Tokenized-Fine
  hf_revision: null
  sources:
    - name: laughlm-v1-mixed
      weight: 1.0
      split: train

  max_seq_len: 2048
  packing: true
  eos_between_docs: true
  pad_to_multiple: 128

  shard_directory: laughlm-v1
  shard_filename_prefix: laughlm-v1_shard

  # Extra 4B training pool; never overlap the permanent validation pool.
  train_shard_start: 80
  train_shard_count: 16
  validation_shard_start: 96
  validation_shard_count: 4

  hf_cache_dir: /tmp/laughlm_hf_cache
  record_exposure_stats: false
  exposure_chunk_tokens: 1000000

tokenizer:
  algorithm: bpe
  vocab_size: 32064
  pre_tokenizer: byte_level
  number_tokenization: whole_number
  output_format: huggingface_fast

parallelism:
  data_parallel: 8
  model_parallel: 1
  compute_dtype: bfloat16
  param_dtype: float32

spmd:
  mesh:
    ici_data_parallelism: 8
    ici_fsdp_parallelism: 1
    ici_tensor_parallelism: 1
    ici_sequence_parallelism: 1
    ici_pipeline_parallelism: 1
    dcn_data_parallelism: 1
    dcn_fsdp_parallelism: 1
    dcn_tensor_parallelism: 1
    dcn_pipeline_parallelism: 1
  axis_rules:
    batch: data
    embed: null
    heads: null
    kv_heads: null
    mlp: null
    vocab: null
    sequence: null
    layers: null
  remat:
    policy: dots_saveable
    granularity: block
    scan_layers: false
    prevent_cse: false
  dtype:
    param_dtype: float32
    compute_dtype: bfloat16
    output_dtype: float32

monitoring:
  tensorboard: false
  rich_terminal: true
  training_integrity: false
  integrity_interval: 100

hardware:
  accelerator: tpu
  type: v5e-8

optimizations:
  compilation_cache_dir: jax_cache/laughlm_v1_127m_24b_extension
  kernel_backend: native
  data_backend: native
  sharding_strategy: pmap
  optimizer_mu_bf16: true
  async_checkpointing: false
