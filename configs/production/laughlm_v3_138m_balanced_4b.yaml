# LaughLM-v3: balanced 138M production model.
#
# This is a standalone 4B-token first milestone on a fixed 20B-token WSD
# schedule. It deliberately balances the very shallow 1024x8 LaughLM-v1
# geometry against the 576x30 SmolLM2 geometry: 768 hidden units over 18
# layers keeps 64-wide heads and TPU-friendly 768x2048 matrix shapes.

model:
  vocab_size: 32064
  d_model: 768
  num_layers: 18
  num_heads: 12
  num_kv_heads: 4
  max_seq_len: 2048

architecture:
  positional: rope
  normalization: rms_norm
  norm_placement: pre
  attention_variant: gqa
  attention_impl: splash
  attention_fallback: error
  splash_block_size: 512
  fused_qkv: true
  ffn_type: swiglu
  residual: standard
  embeddings: standard
  bias: false
  weight_tying: true
  parallel_block: false

initialization:
  method: normal
  # SmolLM2-style initializer range (1 / 24). The 100M-token validation run
  # was stable with this value: loss decreased smoothly without grad-norm
  # spikes.
  std: 0.041666666666666664
  embedding_std: 0.041666666666666664
  attention_std: 0.041666666666666664
  mlp_std: 0.041666666666666664
  residual_scale: 1.0

optimizer:
  type: adamw
  learning_rate: 2.0e-4
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  weight_decay: 0.1
  gradient_clip: 1.0
  mu_dtype: bfloat16

scheduler:
  type: wsd
  # Keep fixed when cumulative milestones become 8B/12B/16B/20B.
  horizon_tokens: 20_000_000_000
  warmup_fraction: 0.01
  stable_fraction: 0.95
  min_lr_ratio: 0.05

loss:
  # Native chunked CE was faster than the latest no-remat trial on the v5e-8.
  backend: native
  chunked_logits: true
  logits_chunk_size: 4096
  remat_logits_chunks: true
  z_loss: 1.0e-4
  ignore_index: -100

runtime:
  backend: pmap
  seq_len: 2048
  # Same 1,048,576-token optimizer batch as the proven 2x32 geometry, with
  # half as many accumulation-loop iterations. Smoke-test this geometry before
  # committing to the full milestone.
  micro_batch_per_device: 4
  gradient_accumulation: 16
  prefetch_size: 64
  total_tokens: 4_000_000_000
  eval_interval: 500
  eval_batches: 4
  log_interval: 100
  checkpoint_interval: 500
  checkpoint_max_to_keep: 2
  checkpoint_dir: checkpoints/production/laughlm_v3_138m_balanced_20b

data:
  hf_repo_id: LaughTaleAI/LaughLM-Tokenized-Fine
  hf_revision: null
  sources:
    - name: laughlm-v1-mixed
      weight: 1.0
      split: train
  max_seq_len: 2048
  packing: true
  eos_between_docs: true
  pad_to_multiple: 128
  shard_directory: laughlm-v1
  shard_filename_prefix: laughlm-v1_shard
  # 16 x 250M-token shards for the first 4B-token milestone.
  train_shard_start: 0
  train_shard_count: 16
  validation_shard_start: 16
  validation_shard_count: 2
  hf_cache_dir: /tmp/laughlm_hf_cache
  record_exposure_stats: false
  exposure_chunk_tokens: 1000000

tokenizer:
  algorithm: bpe
  vocab_size: 32064
  pre_tokenizer: byte_level
  number_tokenization: whole_number
  output_format: huggingface_fast

parallelism:
  data_parallel: 8
  model_parallel: 1
  compute_dtype: bfloat16
  param_dtype: float32

spmd:
  mesh:
    ici_data_parallelism: 8
    ici_fsdp_parallelism: 1
    ici_tensor_parallelism: 1
    ici_sequence_parallelism: 1
    ici_pipeline_parallelism: 1
    dcn_data_parallelism: 1
    dcn_fsdp_parallelism: 1
    dcn_tensor_parallelism: 1
    dcn_pipeline_parallelism: 1
  axis_rules:
    batch: data
    embed: null
    heads: null
    kv_heads: null
    mlp: null
    vocab: null
    sequence: null
    layers: null
  remat:
    policy: dots_saveable
    granularity: block
    scan_layers: false
    prevent_cse: false
  dtype:
    param_dtype: float32
    compute_dtype: bfloat16
    output_dtype: float32

monitoring:
  tensorboard: false
  rich_terminal: true
  training_integrity: false
  integrity_interval: 100

hardware:
  accelerator: tpu
  type: v5e-8

optimizations:
  compilation_cache_dir: jax_cache/laughlm_v3_138m_balanced_20b
  kernel_backend: native
  data_backend: native
  sharding_strategy: pmap
  optimizer_mu_bf16: true
  # Synchronous completion keeps checkpoint state and v3 metadata atomic.
  async_checkpointing: false
