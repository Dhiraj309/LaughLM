# LaughLM-v1 135M production stage: 4B training tokens plus held-out validation.
#
# Apply on top of:
#   configs/v5e_pmap_true135m_production.yaml
#
# The base config supplies the validated 135M PMAP geometry and shared
# optimizer/loss/dtype settings. This overlay selects the validated GQA 8/4
# candidate and the mixed LaughLM-v1 tokenized corpus.

model:
  # 8 query heads / 4 KV heads: validated GQA candidate for this model size.
  num_kv_heads: 4

architecture:
  attention_variant: gqa
  attention_impl: splash
  attention_fallback: error
  fused_qkv: true
  ffn_type: swiglu
  normalization: rms_norm
  norm_placement: pre
  bias: false
  weight_tying: true

scheduler:
  # Keep fixed across all stages so the WSD curve is not reshaped or restarted
  # when runtime.total_tokens is increased on resume.
  horizon_tokens: 20_000_000_000

runtime:
  backend: pmap
  seq_len: 2048
  micro_batch_per_device: 2
  gradient_accumulation: 32
  prefetch_size: 16
  # Sixteen approximately 250M-token shards provide approximately 4B training tokens.
  total_tokens: 4_000_000_000
  eval_interval: 500
  eval_batches: 4
  log_interval: 10
  checkpoint_interval: 500
  checkpoint_max_to_keep: 2
  checkpoint_dir: checkpoints/production/laughlm_v1_135m_4b

data:
  sources:
    - name: laughlm-v1-mixed
      weight: 1.0
      split: train
  hf_repo_id: "LaughTaleAI/LaughLM-Tokenized-Fine"
  hf_revision: null
  # Train and validation are stored in separate HF folders. Each shard is
  # approximately 250M tokens (~500MB on disk).
  train_shard_directory: "laughlm-v1/train"
  validation_shard_directory: "laughlm-v1/validation"
  validation_shard_filename_prefix: "laughlm-v1_shard"
  # Legacy fallback fields retained for older tools.
  shard_directory: "laughlm-v1"
  shard_filename_prefix: "laughlm-v1_shard"
  train_shard_start: 0
  train_shard_count: 16
  # Validation files retain their original source IDs: 00016 and 00017.
  validation_shard_start: 16
  validation_shard_count: 2

optimizations:
  compilation_cache_dir: jax_cache/laughlm_v1_135m_gqa4_20b
  kernel_backend: native
  data_backend: native
  sharding_strategy: pmap
  optimizer_mu_bf16: true
  async_checkpointing: true
