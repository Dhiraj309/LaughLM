
# ════════════════════════════════════════════════════════════════
# LaughLM — TPU v5e-8 Training Config (Data-Parallel SPMD)
# ════════════════════════════════════════════════════════════════
#
# Strategy: Data-parallel (replicate params, shard batch)
# Reason: 184M model + optimizer = 2.2GB << 16GB per chip.
#   FSDP gives no memory benefit at this scale. Pure data-parallel
#   with large per-chip batch maximizes MXU utilization.
#
# Expected MFU: 38-45% (vs 33% before nn.scan + checkpoint fixes)
# ════════════════════════════════════════════════════════════════

model:
  vocab_size: 50257
  d_model: 1024
  num_layers: 12
  num_heads: 16
  num_kv_heads: 4
  max_seq_len: 2048

architecture:
  positional: rope
  normalization: rms_norm
  norm_placement: pre
  attention_variant: gqa
  attention_impl: flash
  ffn_type: swiglu
  residual: standard
  embeddings: standard
  bias: false
  weight_tying: true
  parallel_block: true

initialization:
  method: normal
  std: 0.02
  embedding_std: 0.02
  attention_std: 0.02
  mlp_std: 0.02
  residual_scale: 1.0

optimizer:
  type: adamw
  learning_rate: 3e-4
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  weight_decay: 0.1
  gradient_clip: 1.0

scheduler:
  type: wsd
  warmup_steps: 200
  min_lr_ratio: 0.01
  stable_fraction: 0.80

runtime:
  # seq_len=1025: after shift → 1024 (Splash-compatible if single-device)
  seq_len: 1025

  # Per-chip: 16 seqs. Logits = 16×1024×50257×4 = 3.2GB (fits easily)
  micro_batch_per_device: 16

  # grad_accum=2: effective = 16×8×2 = 256 seqs = 262K tok/step
  gradient_accumulation: 2

  total_tokens: 500000000

  eval_interval: 50
  log_interval: 10

  # 500 steps between checkpoints — no more 90s stalls every 80s
  checkpoint_interval: 500
  checkpoint_max_to_keep: 3
  checkpoint_dir: checkpoints

data:
  sources: []
  max_seq_len: 1025
  packing: false
  eos_between_docs: true
  pad_to_multiple: 128

tokenizer:
  algorithm: bpe
  vocab_size: 50257
  pre_tokenizer: byte_level
  number_tokenization: single_digit
  output_format: huggingface_fast

hardware:
  accelerator: tpu
  type: v5e

parallelism:
  data_parallel: 8
  model_parallel: 1
  compute_dtype: bfloat16
  param_dtype: float32

monitoring:
  tensorboard: false
  rich_terminal: true

spmd:
  mesh:
    # Data-parallel: all 8 chips shard the batch
    ici_data_parallelism: 8
    ici_fsdp_parallelism: 1
    ici_tensor_parallelism: 1
    ici_sequence_parallelism: 1
    ici_pipeline_parallelism: 1

  axis_rules:
    batch: "batch"
    embed: null
    heads: null
    kv_heads: null
    mlp: null
    vocab: null

  remat:
    policy: nothing_saveable
    scan_layers: true
    prevent_cse: false

  dtype:
    param_dtype: float32
    compute_dtype: bfloat16
    output_dtype: float32