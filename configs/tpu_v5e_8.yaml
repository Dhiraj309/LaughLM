
# ════════════════════════════════════════════════════════════════
# LaughLM — TPU v5e-8 Optimized Training Config
# ════════════════════════════════════════════════════════════════
#
# Target: TPU v5e pod slice with 8 chips (16GB HBM each, 128GB total)
# Peak:   8 × 197 TFLOPS = 1,576 TFLOPS bf16
#
# Key choices for v5e-8:
#   • FSDP across all 8 chips — shards params, grads, optimizer states
#     so each chip holds only 1/8th of each. Enables larger models.
#   • micro_batch=16 per chip — saturates the MXU (Matrix Unit).
#     v5e has smaller HBM (16GB) so we can't go much higher.
#   • gradient_accumulation=2 — effective batch = 16×8×2 = 256 seqs
#     = 256 × 1024 = 262,144 tokens/step (good for 100M token run).
#   • nothing_saveable remat — recompute everything during backward.
#     With FSDP already sharding params, memory savings from remat
#     allow larger batch sizes. Worth the ~33% extra compute.
#   • parallel_block — GPT-J/PaLM style attn+MLP in parallel.
#     Saves one sequential dependency and one all-reduce per layer.
#   • Splash Attention — O(T) memory via Pallas tiled kernel.
#     Native to v5e, ~2× faster than XLA materialized attention.
# ════════════════════════════════════════════════════════════════

model:
  vocab_size: 50257
  d_model: 1024
  num_layers: 12
  num_heads: 16
  num_kv_heads: 4
  max_seq_len: 2048

architecture:
  positional: rope
  normalization: rms_norm
  norm_placement: pre
  attention_variant: gqa
  attention_impl: flash
  ffn_type: swiglu
  residual: standard
  embeddings: standard
  bias: false
  weight_tying: true
  parallel_block: true     # PaLM-style: saves 1 all-reduce/layer in FSDP

initialization:
  method: normal
  std: 0.02
  embedding_std: 0.02
  attention_std: 0.02
  mlp_std: 0.02
  residual_scale: 1.0

optimizer:
  type: adamw
  learning_rate: 3e-4
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  weight_decay: 0.1        # higher WD for larger effective batch (standard at scale)
  gradient_clip: 1.0

scheduler:
  type: wsd                 # Warmup-Stable-Decay (MiniCPM) — can extend training without restart
  warmup_steps: 200
  min_lr_ratio: 0.01
  stable_fraction: 0.80    # 80% stable, 20% decay

runtime:
  # seq_len=1025: after shift_tokens → 1024 tokens in attention.
  # 1024 is perfectly divisible by Splash block sizes (128/256/512).
  seq_len: 1025

  # micro_batch=16 per chip × 8 chips × 2 grad_accum = 256 seqs/step
  # = 256 × 1024 = 262,144 tokens/step
  micro_batch_per_device: 16
  gradient_accumulation: 2

  total_tokens: 100000000   # 100M tokens (~381 steps)

  eval_interval: 50
  log_interval: 10

  checkpoint_interval: 100
  checkpoint_max_to_keep: 3
  checkpoint_dir: checkpoints

data:
  sources: []
  max_seq_len: 1025
  packing: false
  eos_between_docs: true
  pad_to_multiple: 128

tokenizer:
  algorithm: bpe
  vocab_size: 50257
  pre_tokenizer: byte_level
  number_tokenization: single_digit
  output_format: huggingface_fast

hardware:
  accelerator: tpu
  type: v5e

parallelism:
  data_parallel: 8          # 8 chips
  model_parallel: 1
  compute_dtype: bfloat16
  param_dtype: float32

monitoring:
  tensorboard: false
  rich_terminal: true

# ════════════════════════════════════════════════════════════════
# SPMD Configuration (frontier-grade)
# ════════════════════════════════════════════════════════════════
spmd:
  mesh:
    # All 8 chips on FSDP axis — each chip holds 1/8 of params/grads/optimizer
    ici_data_parallelism: 1
    ici_fsdp_parallelism: 8
    ici_tensor_parallelism: 1
    ici_sequence_parallelism: 1
    ici_pipeline_parallelism: 1

  axis_rules:
    batch: "data"
    embed: "fsdp"
    heads: "tensor"
    kv_heads: "tensor"
    mlp: "tensor"
    vocab: "fsdp"

  remat:
    # nothing_saveable: recompute all activations during backward.
    # Trades ~33% extra compute for massive memory savings.
    # With FSDP already sharding params 8-way, this allows
    # micro_batch=16 without OOM on v5e's 16GB HBM.
    policy: nothing_saveable
    scan_layers: true
    prevent_cse: false

  dtype:
    param_dtype: float32     # master weights in fp32 (optimizer accumulation)
    compute_dtype: bfloat16  # activations + matmuls in bf16 (native on v5e)
    output_dtype: float32    # loss in fp32 (numerical stability)
