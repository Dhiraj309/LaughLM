# M6 one-shot TPU memory capture overlay for the GQA comparison run.
# Apply directly on top of v5e_pmap_true135m_mha_compare.yaml. This is a
# complete single overlay because the launcher accepts one override file.

model:
  num_kv_heads: 4

architecture:
  attention_variant: gqa

runtime:
  checkpoint_dir: checkpoints/experiments/135M_gqa4_memory

optimizations:
  compilation_cache_dir: jax_cache/v5e_true135m_gqa4_memory

profiling:
  capture_device_memory_profile: true
  memory_profile_step: 10
  output_dir: profiles/135M_gqa4_memory
