
# ============================================================
# LaughLM TPU v5e-8 FULL-CORE Smoke Test
# ============================================================

model:

  vocab_size: 49152

  #
  # ~282M params
  #

  d_model: 768

  num_layers: 12

  num_heads: 12
  num_kv_heads: 12

  intermediate_size: 3072

  max_seq_len: 1024


# ============================================================
# Architecture
# ============================================================

architecture:

  positional: rope

  normalization: rms_norm
  norm_placement: pre

  attention_variant: gqa
  attention_impl: standard

  ffn_type: swiglu

  residual: standard

  embeddings: standard

  bias: false

  weight_tying: false

  parallel_block: false


# ============================================================
# Initialization
# ============================================================

initialization:

  method: normal

  std: 0.02

  embedding_std: 0.02
  attention_std: 0.02
  mlp_std: 0.02

  residual_scale: 1.0


# ============================================================
# Optimizer
# ============================================================

optimizer:

  type: adamw

  learning_rate: 3.0e-4

  beta1: 0.9
  beta2: 0.95

  eps: 1.0e-8

  weight_decay: 0.1

  gradient_clip: 1.0


# ============================================================
# Scheduler
# ============================================================

scheduler:

  type: cosine

  warmup_fraction: 0.01

  min_lr_ratio: 0.1


# ============================================================
# Runtime
# ============================================================

runtime:

  #
  # Sequence
  #

  seq_len: 1024

  #
  # IMPORTANT
  #
  # v5e-8:
  # 8 TPU chips
  #
  # Global batch:
  # 8 devices × 8 microbatch = 64
  #
  # Tokens/step:
  # 64 × 1024 = 65,536
  #

  micro_batch_per_device: 16

  gradient_accumulation: 1

  #
  # Real smoke test
  #

  total_tokens: 100000000

  eval_interval: 50

  log_interval: 10

  checkpoint_interval: 100

  checkpoint_max_to_keep: 2

  checkpoint_dir: checkpoints


# ============================================================
# Data
# ============================================================

data:

  sources:

    - name: fineweb-edu
      weight: 1.0
      split: train

  max_seq_len: 1024

  packing: true

  eos_between_docs: true

  pad_to_multiple: 128


# ============================================================
# Tokenizer
# ============================================================

tokenizer:

  algorithm: bpe

  vocab_size: 49152

  pre_tokenizer: byte_level

  number_tokenization: whole_number

  output_format: huggingface_fast


# ============================================================
# Legacy Parallelism (schema compatibility)
# ============================================================

parallelism:

  #
  # ALL 8 TPU CORES
  #

  data_parallel: 8

  model_parallel: 1

  compute_dtype: bfloat16

  param_dtype: bfloat16


# ============================================================
# Frontier SPMD Config
# ============================================================

spmd:

  mesh:

    #
    # v5e-8 single-host topology
    #
    # Use ALL 8 chips for DATA PARALLEL
    #

    ici_data_parallelism: 8

    #
    # No FSDP yet
    #

    ici_fsdp_parallelism: 1

    #
    # No tensor parallel yet
    #

    ici_tensor_parallelism: 1

    ici_sequence_parallelism: 1

    ici_pipeline_parallelism: 1

    #
    # Single host
    #

    dcn_data_parallelism: 1

    dcn_fsdp_parallelism: 1

    dcn_tensor_parallelism: 1

    dcn_pipeline_parallelism: 1


  # ==========================================================
  # Axis Rules
  # ==========================================================

  axis_rules:

    #
    # Batch sharded across ALL 8 cores
    #

    batch: data

    #
    # Future TP/FSDP axes
    #

    embed: null

    heads: null

    kv_heads: null

    mlp: null

    vocab: null

    sequence: null

    layers: null


  # ==========================================================
  # Remat
  # ==========================================================

  remat:

    #
    # TPU-friendly
    #

    policy: dots_saveable

    #
    # Remat whole transformer blocks
    #

    granularity: block

    #
    # Lowers compile memory
    #

    scan_layers: true

    prevent_cse: false


  # ==========================================================
  # Dtypes
  # ==========================================================

  dtype:

    #
    # TPU-native
    #

    param_dtype: bfloat16

    compute_dtype: bfloat16

    output_dtype: float32


# ============================================================
# Monitoring
# ============================================================

monitoring:

  tensorboard: false

  rich_terminal: true


# ============================================================
# Hardware
# ============================================================

hardware:

  accelerator: tpu

  type: v5e-8
