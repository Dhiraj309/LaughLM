
# ============================================================
# LaughLM TPU v5e High-Utilization Runtime Validation
# ============================================================

model:

  vocab_size: 49152

  # ==========================================================
  # REAL medium-scale runtime validation
  # ==========================================================

  d_model: 768

  num_layers: 16

  num_heads: 6
  num_kv_heads: 2

  intermediate_size: 3072

  max_seq_len: 2048


# ============================================================
# Architecture
# ============================================================

architecture:

  positional: rope

  normalization: rms_norm

  norm_placement: pre

  attention_variant: gqa

  # ==========================================================
  # CUSTOM ONLINE ATTENTION
  # ==========================================================

  attention_impl: flash

  ffn_type: swiglu

  residual: standard

  embeddings: standard

  bias: false

  weight_tying: false

  parallel_block: false


# ============================================================
# Initialization
# ============================================================

initialization:

  method: normal

  std: 0.02

  embedding_std: 0.02

  attention_std: 0.02

  mlp_std: 0.02

  residual_scale: 1.0


# ============================================================
# Optimizer
# ============================================================

optimizer:

  type: adamw

  learning_rate: 3.0e-4

  beta1: 0.9

  beta2: 0.95

  eps: 1.0e-8

  weight_decay: 0.1

  gradient_clip: 1.0


# ============================================================
# Scheduler
# ============================================================

scheduler:

  type: cosine

  warmup_fraction: 0.01

  min_lr_ratio: 0.1


# ============================================================
# Runtime
# ============================================================

runtime:

  # ==========================================================
  # REAL sequence length
  # ==========================================================

  seq_len: 2048

  # ==========================================================
  # Aggressive but safe v5e-1 utilization
  # ==========================================================

  micro_batch_per_device: 8

  gradient_accumulation: 1

  # ==========================================================
  # Real runtime validation
  # ==========================================================

  total_tokens: 1048576

  eval_interval: 25

  log_interval: 5

  checkpoint_interval: 100

  checkpoint_max_to_keep: 2

  checkpoint_dir: checkpoints/v5e_smoke


# ============================================================
# Data
# ============================================================

data:

  sources:

    - name: fineweb-edu
      weight: 1.0
      split: train

  max_seq_len: 2048

  packing: true

  eos_between_docs: true

  pad_to_multiple: 128


# ============================================================
# Tokenizer
# ============================================================

tokenizer:

  algorithm: bpe

  vocab_size: 49152

  pre_tokenizer: byte_level

  number_tokenization: whole_number

  output_format: huggingface_fast


# ============================================================
# Legacy Parallelism
# ============================================================

parallelism:

  data_parallel: 1

  model_parallel: 1

  compute_dtype: bfloat16

  param_dtype: bfloat16


# ============================================================
# Frontier SPMD Config
# ============================================================

spmd:

  mesh:

    ici_data_parallelism: 1

    ici_fsdp_parallelism: 1

    ici_tensor_parallelism: 1

    ici_sequence_parallelism: 1

    ici_pipeline_parallelism: 1

    dcn_data_parallelism: 1

    dcn_fsdp_parallelism: 1

    dcn_tensor_parallelism: 1

    dcn_pipeline_parallelism: 1


  # ==========================================================
  # Axis Rules
  # ==========================================================

  axis_rules:

    batch: data

    embed: null

    heads: null

    kv_heads: null

    mlp: null

    vocab: null

    sequence: null

    layers: null


  # ==========================================================
  # Remat
  # ==========================================================

  remat:

    policy: dots_saveable

    granularity: block

    # ========================================================
    # KEEP scan disabled initially
    # ========================================================

    scan_layers: false

    prevent_cse: false

    remat_attention: true

    remat_mlp: true


  # ==========================================================
  # Dtypes
  # ==========================================================

  dtype:

    param_dtype: bfloat16

    compute_dtype: bfloat16

    output_dtype: float32


# ============================================================
# Monitoring
# ============================================================

monitoring:

  tensorboard: false

  rich_terminal: true


# ============================================================
# Hardware
# ============================================================

hardware:

  accelerator: tpu

  type: v5e
