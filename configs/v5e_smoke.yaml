
# ============================================================
# LaughLM TPU v5e Smoke Test
# Single-host TPU v5e-1
# Mesh-native GSPMD validation
# ============================================================

model:

  # ----------------------------------------------------------
  # Small-but-real TPU smoke model
  # ----------------------------------------------------------

  vocab_size: 49152

  d_model: 768

  num_layers: 12

  num_heads: 12

  num_kv_heads: 12

  intermediate_size: 3072

  max_seq_len: 512


# ============================================================
# Architecture
# ============================================================

architecture:

  positional: rope

  normalization: rms_norm

  norm_placement: pre

  attention_variant: gqa

  attention_impl: standard

  ffn_type: swiglu

  residual: standard

  embeddings: standard

  bias: false

  weight_tying: false

  parallel_block: false


# ============================================================
# Initialization
# ============================================================

initialization:

  method: normal

  std: 0.02

  embedding_std: 0.02

  attention_std: 0.02

  mlp_std: 0.02

  residual_scale: 1.0


# ============================================================
# Runtime
# ============================================================

runtime:

  seq_len: 512

  # TPU likes larger batch
  micro_batch_per_device: 64

  gradient_accumulation: 1

  total_tokens: 2000000

  eval_interval: 100

  log_interval: 1

  checkpoint_interval: 100

  checkpoint_max_to_keep: 2

  checkpoint_dir: checkpoints


# ============================================================
# Dataset
# ============================================================

data:

  sources:

    - name: fineweb_edu
      weight: 1.0

  max_seq_len: 512

  packing: false

  eos_between_docs: true

  pad_to_multiple: 128


# ============================================================
# Tokenizer
# ============================================================

tokenizer:

  algorithm: bpe

  vocab_size: 49152

  pre_tokenizer: byte_level

  number_tokenization: whole_number

  output_format: huggingface_fast


# ============================================================
# Optimizer
# ============================================================

optimizer:

  type: adamw

  learning_rate: 3.0e-4

  weight_decay: 0.1

  beta1: 0.9

  beta2: 0.95

  eps: 1.0e-8

  gradient_clip: 1.0


# ============================================================
# Scheduler
# ============================================================

scheduler:

  type: cosine

  warmup_steps: 50

  min_lr_ratio: 0.1


# ============================================================
# Legacy compatibility
# ============================================================

parallelism:

  data_parallel: 1

  model_parallel: 1

  # TPU SHOULD use bf16 params too
  compute_dtype: bfloat16

  param_dtype: bfloat16


# ============================================================
# Frontier SPMD config
# ============================================================

spmd:

  mesh:

    # Single v5e-1
    ici_data_parallelism: 1

    ici_fsdp_parallelism: 1

    ici_tensor_parallelism: 1

    ici_sequence_parallelism: 1

    ici_pipeline_parallelism: 1

    dcn_data_parallelism: 1

    dcn_fsdp_parallelism: 1

    dcn_tensor_parallelism: 1

    dcn_pipeline_parallelism: 1

  axis_rules:

    batch: data

    embed: null

    heads: null

    kv_heads: null

    mlp: null

    vocab: null

    sequence: null

    layers: null

  remat:

    # TPU likes aggressive remat
    policy: dots_saveable

    granularity: block

    scan_layers: true

    prevent_cse: false

  dtype:

    # TPU-native
    param_dtype: bfloat16

    compute_dtype: bfloat16

    output_dtype: float32


# ============================================================
# Monitoring
# ============================================================

monitoring:

  tensorboard: false

  rich_terminal: true


# ============================================================
# Hardware
# ============================================================

hardware:

  accelerator: tpu

  type: v5e
