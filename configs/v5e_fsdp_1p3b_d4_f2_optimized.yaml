model:
  vocab_size: 32064
  d_model: 2048
  num_layers: 24
  num_heads: 32
  num_kv_heads: 32
  max_seq_len: 8192

architecture:
  positional: rope
  normalization: rms_norm
  norm_placement: pre
  attention_variant: gqa
  attention_impl: splash
  attention_fallback: error
  fused_qkv: true
  ffn_type: swiglu
  residual: standard
  embeddings: standard
  bias: false
  weight_tying: true
  parallel_block: false

initialization:
  method: normal
  std: 0.01
  embedding_std: 0.01
  attention_std: 0.01
  mlp_std: 0.01
  residual_scale: 1.0

optimizer:
  type: adamw
  learning_rate: 5.0e-5
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  weight_decay: 0.1
  gradient_clip: 1.0
  mu_dtype: bfloat16

scheduler:
  type: wsd
  horizon_tokens: 100_007_936
  warmup_fraction: 0.01
  stable_fraction: 0.95
  min_lr_ratio: 0.05

loss:
  chunked_logits: true
  logits_chunk_size: 4096
  remat_logits_chunks: false
  z_loss: 1.0e-4
  ignore_index: -100

runtime:
  backend: fsdp
  seq_len: 1024
  micro_batch_per_device: 2
  gradient_accumulation: 16
  total_tokens: 100_007_936
  eval_interval: 10000
  log_interval: 20
  metrics_interval: 0
  benchmark_mode: false
  checkpoint_interval: 500
  checkpoint_max_to_keep: 3
  checkpoint_dir: checkpoints/v5e_fsdp_1p3b_d4_f2_optimized

data:
  sources:
    - name: cpt-smollm-edu-smoke-100m
      weight: 1.0
      split: train
  max_seq_len: 1024
  packing: true
  eos_between_docs: true
  pad_to_multiple: 128

tokenizer:
  algorithm: bpe
  vocab_size: 32064
  pre_tokenizer: byte_level
  number_tokenization: whole_number
  output_format: huggingface_fast

parallelism:
  data_parallel: 4
  model_parallel: 2
  compute_dtype: bfloat16
  param_dtype: float32

spmd:
  mesh:
    ici_data_parallelism: 4
    ici_fsdp_parallelism: 2
    ici_tensor_parallelism: 1
    ici_sequence_parallelism: 1
    ici_pipeline_parallelism: 1
    dcn_data_parallelism: 1
    dcn_fsdp_parallelism: 1
    dcn_tensor_parallelism: 1
    dcn_pipeline_parallelism: 1

  axis_rules:
    batch: data
    embed: fsdp
    heads: null
    kv_heads: null
    mlp: null
    vocab: null
    sequence: null
    layers: null

  remat:
    policy: dots_saveable
    granularity: block
    scan_layers: false
    prevent_cse: false

  dtype:
    param_dtype: float32
    compute_dtype: bfloat16
    output_dtype: float32

monitoring:
  tensorboard: false
  rich_terminal: true

hardware:
  accelerator: tpu
  type: v5e-8
