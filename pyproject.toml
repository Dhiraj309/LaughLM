[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laughlm"
version = "0.1.0"
description = "Configuration-driven decoder-only LLM training system built with JAX"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "LaughLM Team" }
]
license = { text = "MIT" }

dependencies = [
    # Keep the JAX/Flax pair on a release line with the Hijax API expected by
    # Flax NNX.  Unbounded lower-only requirements can resolve to an invalid
    # mixed installation (for example, newer Flax with older JAX).
    "jax==0.4.38",
    "jaxlib==0.4.38",
    "flax==0.10.2",
    "optax==0.2.4",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "numpy>=1.24",
    "tqdm>=4.65",
    "tokenizers>=0.15",
    "datasets>=2.14",
    "orbax-checkpoint==0.11.4",
    "huggingface_hub>=0.16",
    "transformers>=4.30",
]

[project.optional-dependencies]
dev = [
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pytest>=7.0",
]
kernels = [
    "tokamax",
]
data = [
    "grain",
]

# Gen-2 TPU pins are intentionally a separate lane.  The stable project
# dependencies above remain the default and must not be resolved together
# with these mutually incompatible JAX/Flax versions.  The reproducible
# installer consumes requirements/inputs/gen2-tpu-v5e-py312.in; this table
# keeps the requested TPU wheel source and pins discoverable in project
# metadata without pretending that ``pip install .[gen2-tpu]`` is safe.
[tool.laughlm.dependency-lanes.gen2-tpu]
find-links = [
    "https://storage.googleapis.com/jax-releases/libtpu_releases.html",
]
packages = [
    "jax[tpu]==0.11.1",
    "flax==0.12.9",
    "optax==0.2.8",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "LaughLM*",
    "configs*",
    "scripts*",
]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "W"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
