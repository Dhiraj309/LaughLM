[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "downstream"
version = "0.1.0"
description = "Transformer Projection and Compression Research Toolkit"
requires-python = ">=3.10"

dependencies = [
    "torch",
    "transformers",
    "safetensors",
    "numpy",
    "pyyaml",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
downstream = "downstream.cli.main:main"
