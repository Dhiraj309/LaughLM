name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "roadmap/**"
      - "fix/**"
      - "feature/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable-cpu:
    name: stable CPU
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/locks/legacy-cpu-py312.txt -e ".[dev]"

      - name: Verify JAX and Flax compatibility
        run: |
          python - <<'PY'
          import importlib.metadata as metadata

          expected = {
              "jax": "0.4.38",
              "jaxlib": "0.4.38",
              "flax": "0.10.2",
              "optax": "0.2.4",
              "orbax-checkpoint": "0.11.4",
          }
          for package, expected_version in expected.items():
              version = metadata.version(package)
              if version != expected_version:
                  raise SystemExit(
                      f"{package}={version} != expected {expected_version}"
                  )
              print(f"{package}=={version}")
          PY
          python -m pip check

      - name: Run stable compatibility and test gate
        run: |
          pytest tests/test_backend_config.py \
                 tests/test_checkpoint_metadata.py \
                 tests/test_dependency_lanes.py \
                 tests/test_gspmd_compile.py \
                 tests/test_kv_cache_parity.py \
                 tests/test_tiny_overfit.py \
                 tests/test_tpu_train_step.py \
                 tests/test_train_state.py \
                 tests/test_ci_dependency_lanes.py \
                 tests/test_gen2_dependency_input.py \
                 tests/test_gen2_tpu_dependency_config.py \
                 tests/test_benchmark_result.py \
                 tests/test_optional_capabilities.py \
                 tests/test_profiling.py \
                 -q

  gen2-cpu:
    name: Gen-2 CPU
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Gen-2 package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/inputs/gen2-cpu-py312.in
          python -m pip install --no-deps -e .

      - name: Verify Gen-2 JAX, Flax, and optional capability versions
        run: |
          python - <<'PY'
          import importlib.metadata as metadata

          expected = {
              "jax": "0.11.1",
              "jaxlib": "0.11.1",
              "flax": "0.12.9",
              "optax": "0.2.8",
              "orbax-checkpoint": "0.12.4",
              "tokamax": "0.0.13",
              "xprof": "2.23.1",
              "grain": "0.2.18",
              "pydantic": "2.13.5",
          }
          for package, expected_version in expected.items():
              version = metadata.version(package)
              if version != expected_version:
                  raise SystemExit(
                      f"{package}={version} != expected {expected_version}"
                  )
              print(f"{package}=={version}")
          PY
          python -m pip check

      - name: Run Gen-2 compatibility and stable test gate
        run: |
          pytest tests/test_backend_config.py \
                 tests/test_checkpoint_metadata.py \
                 tests/test_dependency_lanes.py \
                 tests/test_gspmd_compile.py \
                 tests/test_kv_cache_parity.py \
                 tests/test_tiny_overfit.py \
                 tests/test_tpu_train_step.py \
                 tests/test_train_state.py \
                 tests/test_ci_dependency_lanes.py \
                 tests/test_gen2_dependency_input.py \
                 tests/test_gen2_tpu_dependency_config.py \
                 tests/test_benchmark_result.py \
                 tests/test_optional_capabilities.py \
                 tests/test_profiling.py \
                 -q
